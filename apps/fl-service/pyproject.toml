[project]
name = "zorq-fl-service"
version = "0.1.0"
description = "Zorq Flower demonstration FL service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.138.0",
  "uvicorn[standard]==0.49.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "flwr==1.42.0",
  "torch==2.9.1",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "sqlalchemy>=2.0.45,<3",
  "psycopg[binary]==3.2.10",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
